<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e"><title>PFAB Water Meter</title>
<style>
:root{color-scheme:light dark;--bg:#f4f7f7;--card:#fff;--text:#102a2a;--muted:#667777;--brand:#0f766e;--accent:#14b8a6;--border:#d8e2e2}
@media(prefers-color-scheme:dark){:root{--bg:#071313;--card:#102121;--text:#eefafa;--muted:#9db3b3;--border:#294040}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:760px;margin:auto;padding:18px 14px 40px}.hero{background:linear-gradient(135deg,#0f766e,#115e59);color:#fff;border-radius:22px;padding:22px}.hero h1{margin:0;font-size:28px}.hero p{margin:7px 0 0;opacity:.9}.sync{font-size:13px;margin-top:13px;opacity:.9}.actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:9px;margin:14px 0}.actions button{border:0;border-radius:14px;padding:13px 10px;font-weight:800;font-size:15px;cursor:pointer}.primary{background:var(--accent);color:#05201d}.secondary{background:var(--card);color:var(--text);border:1px solid var(--border)!important}.grid{display:grid;grid-template-columns:1fr 1fr;gap:11px}.card{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px}.label{font-size:12px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:800}.value{font-size:28px;font-weight:900;margin-top:9px}.dates{font-size:13px;color:var(--muted);margin-top:4px}.history{margin-top:12px;background:var(--card);border:1px solid var(--border);border-radius:18px;padding:15px}.history h2{font-size:18px;margin:0 0 9px}.table{width:100%;border-collapse:collapse;font-size:14px}.table th,.table td{text-align:left;padding:8px;border-bottom:1px solid var(--border)}.table th:last-child,.table td:last-child{text-align:right}.msg{min-height:22px;margin:12px 2px;color:var(--muted);font-weight:650}.ok{color:#15803d}.err{color:#dc2626}@media(max-width:520px){.grid{grid-template-columns:1fr}.actions{grid-template-columns:1fr}}
</style>
</head>
<body><main class="wrap">
<section class="hero"><h1>PFAB Water Meter</h1><p>Last synced water usage</p><div id="lastSync" class="sync">Loading cloud data...</div></section>
<div class="actions"><button id="syncBtn" class="primary">Connect & Sync Meter</button><button id="reloadBtn" class="secondary">Refresh Cloud Data</button><button id="csvBtn" class="secondary">Download CSV</button></div>
<section class="grid">
<div class="card"><div class="label">Today</div><div id="today" class="value">--</div><div id="todayDates" class="dates">--</div></div>
<div class="card"><div class="label">This Week</div><div id="week" class="value">--</div><div id="weekDates" class="dates">--</div></div>
<div class="card"><div class="label">This Month</div><div id="month" class="value">--</div><div id="monthDates" class="dates">--</div></div>
<div class="card"><div class="label">Last Month</div><div id="lastMonth" class="value">--</div><div id="lastMonthDates" class="dates">--</div></div>
<div class="card"><div class="label">This Year</div><div id="year" class="value">--</div><div id="yearDates" class="dates">--</div></div>
<div class="card"><div class="label">Lifetime</div><div id="life" class="value">--</div><div id="lifeDates" class="dates">--</div></div>
</section>
<section class="history"><h2>Daily History</h2><table class="table"><thead><tr><th>Date</th><th>Gallons</th></tr></thead><tbody id="dailyRows"><tr><td colspan="2">No synced history yet.</td></tr></tbody></table></section>
<div id="msg" class="msg" aria-live="polite"></div>
</main>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js';
import { getFirestore, doc, getDoc, setDoc, serverTimestamp } from 'https://www.gstatic.com/firebasejs/11.0.2/firebase-firestore.js';
const firebaseConfig={apiKey:'AIzaSyDKpSvfhjNKWH9N_RI00tm5w62_8clb3OI',authDomain:'pfab-water-meter.firebaseapp.com',projectId:'pfab-water-meter',storageBucket:'pfab-water-meter.firebasestorage.app',messagingSenderId:'639695222791',appId:'1:639695222791:web:02c5b80f2a626345ba92a2'};
const app=initializeApp(firebaseConfig), db=getFirestore(app), meterRef=doc(db,'waterMeter','pfab');
const SERVICE='9f441000-34f4-44ad-9e6f-4e14d6207891', DATA='9f441001-34f4-44ad-9e6f-4e14d6207891', CSV='9f441002-34f4-44ad-9e6f-4e14d6207891', CMD='9f441003-34f4-44ad-9e6f-4e14d6207891';
const $=id=>document.getElementById(id), dec=new TextDecoder(), enc=new TextEncoder(); let cloud=null;
function msg(t,c=''){ $('msg').textContent=t;$('msg').className='msg '+c; } function gal(v){return Number(v||0).toLocaleString()+' gal';}
function draw(x){cloud=x;if(!x)return;const s=x.summary||{};$('today').textContent=gal(s.today?.gallons);$('todayDates').textContent=s.today?.date||'--';$('week').textContent=gal(s.this_week?.gallons);$('weekDates').textContent=s.this_week?`${s.this_week.start} to ${s.this_week.end}`:'--';$('month').textContent=gal(s.this_month?.gallons);$('monthDates').textContent=s.this_month?.month||'--';$('lastMonth').textContent=gal(s.last_month?.gallons);$('lastMonthDates').textContent=s.last_month?`${s.last_month.start} to ${s.last_month.end}`:'--';$('year').textContent=gal(s.this_year?.gallons);$('yearDates').textContent=s.this_year?`${s.this_year.start} to ${s.this_year.end}`:'--';$('life').textContent=gal(s.lifetime?.gallons);$('lifeDates').textContent=s.lifetime?`Since ${s.lifetime.start}`:'--';$('lastSync').textContent=x.syncedAtText?`Last synced: ${x.syncedAtText}`:'No sync recorded yet';const rows=x.daily||[];$('dailyRows').innerHTML=rows.length?rows.map(r=>`<tr><td>${r.date}</td><td>${Number(r.gallons).toLocaleString()}</td></tr>`).join(''):'<tr><td colspan="2">No synced history yet.</td></tr>';}
async function load(){try{const snap=await getDoc(meterRef);if(snap.exists()){draw(snap.data());msg('Cloud data loaded.','ok')}else{msg('No PFAB meter sync has been uploaded yet.')}}catch(e){msg('Cloud read failed: '+e.message,'err')}}
function csvText(rows){return 'Date,Daily Gallons\r\n'+rows.map(r=>`${r.date},${r.gallons}`).join('\r\n')+'\r\n';}
async function saveCsv(){if(!cloud){msg('No synced data to export.','err');return}const text=csvText(cloud.daily||[]);const f=new File([text],'PFAB_Water_Meter.csv',{type:'text/csv'});if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({title:'PFAB Water Meter',files:[f]});}else{const u=URL.createObjectURL(f),a=document.createElement('a');a.href=u;a.download=f.name;a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}}
async function sync(){try{if(!navigator.bluetooth)throw new Error('Use Bluefy on iPhone to sync the meter.');msg('Choose Ryan Water Meter...');const dev=await navigator.bluetooth.requestDevice({filters:[{name:'Ryan Water Meter'}],optionalServices:[SERVICE]});const server=await dev.gatt.connect(),svc=await server.getPrimaryService(SERVICE);const [dataChar,csvChar,cmdChar]=await Promise.all([svc.getCharacteristic(DATA),svc.getCharacteristic(CSV),svc.getCharacteristic(CMD)]);const val=await dataChar.readValue(),summary=JSON.parse(dec.decode(val));let parts=[],resolveDone,rejectDone;const done=new Promise((r,j)=>{resolveDone=r;rejectDone=j});const timer=setTimeout(()=>rejectDone(new Error('Daily-history transfer timed out.')),15000);const handler=e=>{const t=dec.decode(e.target.value).replace(/\0/g,'');if(t.trim()==='END'){clearTimeout(timer);resolveDone()}else parts.push(t)};await csvChar.startNotifications();csvChar.addEventListener('characteristicvaluechanged',handler);await cmdChar.writeValueWithResponse(enc.encode('CSV'));await done;csvChar.removeEventListener('characteristicvaluechanged',handler);let lines=parts.join('').replace(/\r/g,'').split('\n').map(x=>x.trim()).filter(Boolean);let map=new Map();for(const line of lines){const m=line.match(/^(\d{2}\/\d{2}\/\d{4}),(\d+)$/);if(m)map.set(m[1],Number(m[2]));}const daily=[...map].map(([date,gallons])=>({date,gallons}));const syncedAtText=new Date().toLocaleString();await setDoc(meterRef,{summary,daily,syncedAtText,updatedAt:serverTimestamp()});draw({summary,daily,syncedAtText});msg('Meter synced to cloud. Anyone with the online dashboard can now see these saved readings.','ok');dev.gatt.disconnect();}catch(e){msg('Sync failed: '+e.message,'err')}}
$('syncBtn').addEventListener('click',sync);$('reloadBtn').addEventListener('click',load);$('csvBtn').addEventListener('click',saveCsv);load();
</script></body></html>
